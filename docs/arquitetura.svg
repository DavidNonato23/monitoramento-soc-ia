<svg viewBox="0 0 1240 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8aa3"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d17"/>
      <stop offset="1" stop-color="#12121f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <text x="620" y="42" text-anchor="middle" fill="#f5f5f5" font-size="26" font-weight="700">VanguardSec AI — Arquitetura do Sistema</text>
  <text x="620" y="66" text-anchor="middle" fill="#8a8aa3" font-size="13">SecOps &amp; SOAR autônomo, alimentado por IA local via Ollama</text>

  <!-- SECTION 1: INFRA -->
  <text x="40" y="102" fill="#e94560" font-size="15" font-weight="700">1 · INFRAESTRUTURA ALVO (AGENTLESS)</text>
  <rect x="40" y="112" width="1160" height="120" rx="10" fill="#1a1a2e" stroke="#e94560" stroke-width="2"/>

  <g font-size="12.5" fill="#f5f5f5">
    <rect x="60" y="132" width="350" height="80" rx="6" fill="#20203a" stroke="#e94560"/>
    <text x="80" y="152" font-weight="700">🐧 Servidor Linux Target</text>
    <text x="80" y="170" fill="#c9c9d6">• Auth Logs (/var/log/auth.log)</text>
    <text x="80" y="186" fill="#c9c9d6">• Daemon SSH (porta 22)</text>
    <text x="80" y="202" fill="#c9c9d6">• UFW Firewall &amp; IPTables</text>

    <rect x="440" y="132" width="350" height="80" rx="6" fill="#20203a" stroke="#e94560"/>
    <text x="460" y="152" font-weight="700">🪟 Servidor Windows Target</text>
    <text x="460" y="170" fill="#c9c9d6">• Event Viewer (Security Logs)</text>
    <text x="460" y="186" fill="#c9c9d6">• Conexão WinRM (porta 5985)</text>
    <text x="460" y="202" fill="#c9c9d6">• Serviços e processos ativos</text>

    <rect x="820" y="132" width="360" height="80" rx="6" fill="#20203a" stroke="#e94560"/>
    <text x="840" y="152" font-weight="700">📡 Telemetria de Host Local</text>
    <text x="840" y="170" fill="#c9c9d6">• Métricas via psutil (CPU/RAM/Disco)</text>
    <text x="840" y="186" fill="#c9c9d6">• Conexões de rede ativas (LISTEN)</text>
    <text x="840" y="202" fill="#c9c9d6">• Firewall do sistema operacional</text>
  </g>

  <line x1="620" y1="232" x2="620" y2="266" stroke="#8a8aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="252" fill="#8a8aa3" font-size="11">SSH (Paramiko) / WinRM (pywinrm) / psutil</text>

  <!-- SECTION 2: ENGINE -->
  <text x="40" y="292" fill="#00d9ff" font-size="15" font-weight="700">2 · VANGUARDSEC AI ENGINE (CORE)</text>
  <rect x="40" y="302" width="1160" height="320" rx="10" fill="#16213e" stroke="#00d9ff" stroke-width="2"/>

  <rect x="60" y="322" width="1120" height="46" rx="6" fill="#1c2c52" stroke="#00d9ff"/>
  <text x="80" y="350" fill="#f5f5f5" font-size="13" font-weight="700">📥 Módulos Coletores Telemétricos — coletor_ssh.py (Paramiko) · coletor_winrm.py (pywinrm)</text>

  <line x1="620" y1="368" x2="620" y2="392" stroke="#8a8aa3" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="410" fill="#00ff9d" font-size="13" font-weight="700">🧠 ESTEIRA MULTI-TIER DE INTELIGÊNCIA ARTIFICIAL</text>
  <rect x="60" y="420" width="1120" height="130" rx="8" fill="#0f3460" stroke="#00ff9d" stroke-width="1.5"/>

  <g font-size="12.5" fill="#f5f5f5">
    <rect x="80" y="440" width="330" height="90" rx="6" fill="#14406b" stroke="#00ff9d"/>
    <text x="98" y="462" font-weight="700">🔍 Tier 1 — Analista SOC</text>
    <text x="98" y="480" fill="#c9c9d6" font-size="11.5">agente_auditor.py</text>
    <text x="98" y="497" fill="#c9c9d6" font-size="11.5">Análise tática, IoCs e</text>
    <text x="98" y="512" fill="#c9c9d6" font-size="11.5">superfície de ataque</text>

    <rect x="440" y="440" width="330" height="90" rx="6" fill="#14406b" stroke="#00ff9d"/>
    <text x="458" y="462" font-weight="700">⚖️ Tier 2 — Compliance LGPD</text>
    <text x="458" y="480" fill="#c9c9d6" font-size="11.5">agente_compliance.py</text>
    <text x="458" y="497" fill="#c9c9d6" font-size="11.5">Mapeamento legal e</text>
    <text x="458" y="512" fill="#c9c9d6" font-size="11.5">risco de dados</text>

    <rect x="800" y="440" width="330" height="90" rx="6" fill="#14406b" stroke="#00ff9d"/>
    <text x="818" y="462" font-weight="700">🛠️ Tier 3 — Engenheiro SOAR</text>
    <text x="818" y="480" fill="#c9c9d6" font-size="11.5">agente_remediacao.py</text>
    <text x="818" y="497" fill="#c9c9d6" font-size="11.5">Playbooks e fixes</text>
    <text x="818" y="512" fill="#c9c9d6" font-size="11.5">executáveis em Bash</text>
  </g>

  <line x1="410" y1="485" x2="440" y2="485" stroke="#00ff9d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="485" x2="800" y2="485" stroke="#00ff9d" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="566" width="330" height="46" rx="20" fill="#0f3460" stroke="#00d9ff" stroke-width="2"/>
  <text x="605" y="595" text-anchor="middle" fill="#f5f5f5" font-size="12.5" font-weight="700">🦙 Ollama Engine — qwen2.5:1.5b (100% on-premise)</text>
  <line x1="605" y1="566" x2="605" y2="550" stroke="#00d9ff" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <line x1="620" y1="622" x2="620" y2="656" stroke="#8a8aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="644" fill="#8a8aa3" font-size="11">Diagnósticos, laudos legais e comandos de contenção</text>

  <!-- SECTION 3: DASHBOARD -->
  <text x="40" y="682" fill="#00ff9d" font-size="15" font-weight="700">3 · PAINEL DE CONTROLE &amp; DASHBOARD SOC (app.py)</text>
  <rect x="40" y="692" width="1160" height="90" rx="10" fill="#1a1a2e" stroke="#00ff9d" stroke-width="2"/>
  <g font-size="11.5" fill="#f5f5f5">
    <text x="66" y="726">📈 Dashboard</text>
    <text x="66" y="742" fill="#8a8aa3" font-size="10">Executivo</text>

    <text x="220" y="726">🔬 Esteira</text>
    <text x="220" y="742" fill="#8a8aa3" font-size="10">Multi-Tier</text>

    <text x="380" y="726">🌐 Monitoramento</text>
    <text x="380" y="742" fill="#8a8aa3" font-size="10">Infraestrutura</text>

    <text x="560" y="726">🛡️ Playbooks SOAR</text>
    <text x="560" y="742" fill="#8a8aa3" font-size="10">Kill Switch</text>

    <text x="760" y="726">📂 Gestão de</text>
    <text x="760" y="742" fill="#8a8aa3" font-size="10">Incidentes</text>

    <text x="910" y="726">📱 Painel</text>
    <text x="910" y="742" fill="#8a8aa3" font-size="10">ChatOps</text>

    <text x="1040" y="726">📄 Centro de</text>
    <text x="1040" y="742" fill="#8a8aa3" font-size="10">Relatórios</text>
  </g>

  <line x1="300" y1="782" x2="180" y2="816" stroke="#8a8aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="782" x2="1020" y2="816" stroke="#8a8aa3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SECTION 4: PERSIST -->
  <text x="40" y="850" fill="#ffd166" font-size="14" font-weight="700">4 · PERSISTÊNCIA &amp; DOCUMENTAÇÃO</text>
  <rect x="40" y="860" width="540" height="120" rx="10" fill="#16213e" stroke="#ffd166" stroke-width="2"/>
  <g font-size="11.5" fill="#f5f5f5">
    <text x="60" y="884">📜 historico_scans.json — histórico de scans e análises de IA</text>
    <text x="60" y="908">📊 historico_incidentes.json — novos vs. resolvidos</text>
    <text x="60" y="932">📕 gerador_pdf.py — laudos executivos p/ diretoria/SOC</text>
    <text x="60" y="956">📋 politicas.py — engine de regras e conformidade legal</text>
  </g>

  <!-- SECTION 5: CHATOPS -->
  <text x="640" y="850" fill="#a06cd5" font-size="14" font-weight="700">5 · CHATOPS &amp; AUTOMAÇÕES (TELEGRAM)</text>
  <rect x="640" y="860" width="560" height="120" rx="10" fill="#16213e" stroke="#a06cd5" stroke-width="2"/>
  <g font-size="11.5" fill="#f5f5f5">
    <text x="660" y="884">🤖 chatops_bot.py — 60 automações SOAR via chat</text>
    <text x="660" y="908">🔘 Botões inline — bloqueio imediato de IP</text>
    <text x="660" y="932">🔔 notificador.py — webhooks → Discord/SIEM</text>
    <text x="660" y="956">↩️ Playbooks de mitigação disparados de volta à infra alvo</text>
