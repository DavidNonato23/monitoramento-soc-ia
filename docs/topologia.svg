  <text x="1150" y="180" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">📊 Streamlit — app.py</text>

  <rect x="1005" y="200" width="290" height="42" rx="6" fill="#0d2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="1150" y="226" text-anchor="middle" fill="#ffffff" font-size="11.5">📈 Dashboard Executivo</text>

  <rect x="1005" y="252" width="290" height="42" rx="6" fill="#0d2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="1150" y="278" text-anchor="middle" fill="#ffffff" font-size="11.5">🔬 Esteira Multi-Tier</text>

  <rect x="1005" y="304" width="290" height="42" rx="6" fill="#0d2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="1150" y="330" text-anchor="middle" fill="#ffffff" font-size="11.5">🌐 Monitoramento Infra</text>

  <rect x="1005" y="356" width="290" height="42" rx="6" fill="#0d2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="1150" y="382" text-anchor="middle" fill="#ffffff" font-size="11.5">🛡️ Playbooks SOAR</text>

  <rect x="1005" y="408" width="290" height="42" rx="6" fill="#0d2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="1150" y="434" text-anchor="middle" fill="#ffffff" font-size="11.5">📱 Painel ChatOps</text>

  <rect x="1005" y="460" width="290" height="42" rx="6" fill="#0d2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="1150" y="486" text-anchor="middle" fill="#ffffff" font-size="11.5">📄 Centro de Relatórios</text>

  <path d="M930 470 L980 470" stroke="#00ff9d" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="955" y="460" text-anchor="middle" fill="#00ff9d" font-size="9">diagnósticos</text>

  <!-- ============ CAMADA 4: PERSISTÊNCIA ============ -->
