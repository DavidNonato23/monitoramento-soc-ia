  </g>
  <text x="525" y="365" text-anchor="middle" fill="#00d9ff" font-size="16" font-weight="700" letter-spacing="1">② VANGUARDSEC AI ENGINE — CORE</text>

  <!-- Coletores -->
  <rect x="150" y="385" width="320" height="60" rx="8" fill="#0d1f2b" stroke="#00d9ff" stroke-width="1.2" opacity="0.9"/>
  <text x="310" y="410" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">📥 Módulos Coletores Telemétricos</text>
  <text x="310" y="428" text-anchor="middle" fill="#8fbfd6" font-size="10.5">coletor_ssh.py (Paramiko) · coletor_winrm.py (pywinrm)</text>

  <!-- Multi-tier AI pipeline -->
  <rect x="150" y="460" width="500" height="130" rx="8" fill="#081420" stroke="#00ff9d" stroke-width="1.3" stroke-dasharray="3,2"/>
  <text x="400" y="480" text-anchor="middle" fill="#00ff9d" font-size="12" font-weight="700">🧠 ESTEIRA MULTI-TIER DE IA</text>

  <rect x="165" y="490" width="150" height="80" rx="6" fill="#0f2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="240" y="512" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">🔍 Tier 1</text>
  <text x="240" y="527" text-anchor="middle" fill="#a8e8cf" font-size="9.5">Analista SOC</text>
  <text x="240" y="541" text-anchor="middle" fill="#7fa896" font-size="8.5">agente_auditor.py</text>
  <text x="240" y="558" text-anchor="middle" fill="#7fa896" font-size="8">IoCs &amp; superfície de ataque</text>

  <rect x="325" y="490" width="150" height="80" rx="6" fill="#0f2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="400" y="512" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">⚖️ Tier 2</text>
  <text x="400" y="527" text-anchor="middle" fill="#a8e8cf" font-size="9.5">Compliance LGPD</text>
  <text x="400" y="541" text-anchor="middle" fill="#7fa896" font-size="8.5">agente_compliance.py</text>
  <text x="400" y="558" text-anchor="middle" fill="#7fa896" font-size="8">Mapeamento legal &amp; risco</text>

  <rect x="485" y="490" width="150" height="80" rx="6" fill="#0f2a20" stroke="#00ff9d" stroke-width="1"/>
  <text x="560" y="512" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">🛠️ Tier 3</text>
  <text x="560" y="527" text-anchor="middle" fill="#a8e8cf" font-size="9.5">Engenheiro SOAR</text>
  <text x="560" y="541" text-anchor="middle" fill="#7fa896" font-size="8.5">agente_remediacao.py</text>
