  <text x="790" y="557" text-anchor="middle" fill="#8fd9ec" font-size="11">Privacidade Total</text>

  <path d="M680 525 L655 525" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowCyan)"/>

