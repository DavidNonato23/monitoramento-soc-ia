  <path d="M190 270 L190 300 L310 300 L310 385" fill="none" stroke="#e94560" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <path d="M460 270 L460 300 L310 300 L310 385" fill="none" stroke="#e94560" stroke-width="1.8"/>
  <path d="M730 270 L730 300 L310 300 L310 385" fill="none" stroke="#e94560" stroke-width="1.8"/>
  <text x="500" y="295" text-anchor="middle" fill="#e94560" font-size="10">SSH / WinRM / psutil</text>

  <path d="M310 445 L310 460" stroke="#00d9ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

