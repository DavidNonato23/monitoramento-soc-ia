  <text x="215" y="750" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">📜 Histórico</text>
  <text x="215" y="768" text-anchor="middle" fill="#e0c878" font-size="9">historico_scans.json</text>
  <text x="215" y="800" text-anchor="middle" fill="#a89858" font-size="8">Scans, métricas e</text>
  <text x="215" y="811" text-anchor="middle" fill="#a89858" font-size="8">análises de IA</text>

  <rect x="300" y="720" width="140" height="100" rx="7" fill="#241f08" stroke="#ffd166" stroke-width="1"/>
