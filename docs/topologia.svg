  <!-- Background -->
  <rect x="0" y="0" width="1400" height="1000" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1400" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700" letter-spacing="2">🛡️ VANGUARDSEC AI</text>
  <text x="700" y="76" text-anchor="middle" fill="#7f8fa6" font-size="15" letter-spacing="3">TOPOLOGIA DE REDE — ARQUITETURA AGENTLESS</text>
  <line x1="500" y1="92" x2="900" y2="92" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>

  <!-- ============ CAMADA 1: INFRAESTRUTURA ALVO ============ -->
  <text x="90" y="130" fill="#e94560" font-size="14" font-weight="700" letter-spacing="1">① INFRAESTRUTURA ALVO (AGENTLESS)</text>

  <!-- Linux target -->
  <g filter="url(#glowRed)">
    <rect x="70" y="150" width="240" height="120" rx="10" fill="url(#infraGrad)" stroke="#e94560" stroke-width="1.8"/>
  </g>
  <text x="190" y="180" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">🐧 Servidor Linux</text>
  <text x="190" y="203" text-anchor="middle" fill="#c8c8d8" font-size="11.5">Auth Logs (/var/log/auth.log)</text>
  <text x="190" y="221" text-anchor="middle" fill="#c8c8d8" font-size="11.5">SSH Daemon — porta 22</text>
  <text x="190" y="239" text-anchor="middle" fill="#c8c8d8" font-size="11.5">UFW Firewall &amp; IPTables</text>

  <!-- Windows target -->
  <g filter="url(#glowRed)">
    <rect x="340" y="150" width="240" height="120" rx="10" fill="url(#infraGrad)" stroke="#e94560" stroke-width="1.8"/>
  </g>
  <text x="460" y="180" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">🪟 Servidor Windows</text>
  <text x="460" y="203" text-anchor="middle" fill="#c8c8d8" font-size="11.5">Event Viewer (Security Logs)</text>
  <text x="460" y="221" text-anchor="middle" fill="#c8c8d8" font-size="11.5">WinRM — porta 5985</text>
  <text x="460" y="239" text-anchor="middle" fill="#c8c8d8" font-size="11.5">Serviços &amp; Processos Ativos</text>

  <!-- Local host telemetry -->
