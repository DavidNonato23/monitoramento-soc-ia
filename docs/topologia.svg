  <text x="370" y="768" text-anchor="middle" fill="#e0c878" font-size="9">gerador_pdf.py</text>
  <text x="370" y="800" text-anchor="middle" fill="#a89858" font-size="8">Laudos executivos</text>
  <text x="370" y="811" text-anchor="middle" fill="#a89858" font-size="8">para diretoria/SOC</text>

  <rect x="455" y="720" width="140" height="100" rx="7" fill="#241f08" stroke="#ffd166" stroke-width="1"/>
  <text x="525" y="750" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">📋 Políticas</text>
  <text x="525" y="768" text-anchor="middle" fill="#e0c878" font-size="9">politicas.py</text>
  <text x="525" y="800" text-anchor="middle" fill="#a89858" font-size="8">Engine de regras e</text>
  <text x="525" y="811" text-anchor="middle" fill="#a89858" font-size="8">conformidade legal</text>

  <path d="M1000 590 L1000 630 L370 630 L370 695" fill="none" stroke="#ffd166" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- ============ CAMADA 5: CHATOPS ============ -->
  <text x="920" y="675" fill="#a06cd5" font-size="14" font-weight="700" letter-spacing="1">⑤ CHATOPS &amp; AUTOMAÇÕES</text>
  <g filter="url(#glowPurple)">
    <rect x="680" y="695" width="440" height="150" rx="12" fill="url(#chatGrad)" stroke="#a06cd5" stroke-width="1.8"/>
