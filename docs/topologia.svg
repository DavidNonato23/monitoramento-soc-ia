  <text x="765" y="750" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">🤖 Bot</text>
  <text x="765" y="768" text-anchor="middle" fill="#d4b8ec" font-size="9">chatops_bot.py</text>
  <text x="765" y="800" text-anchor="middle" fill="#9878b0" font-size="8">60 automações</text>
  <text x="765" y="811" text-anchor="middle" fill="#9878b0" font-size="8">SOAR via chat</text>

  <rect x="845" y="720" width="120" height="100" rx="7" fill="#1e0f28" stroke="#a06cd5" stroke-width="1"/>
  <text x="905" y="750" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">🔘 Inline</text>
  <text x="905" y="768" text-anchor="middle" fill="#d4b8ec" font-size="9">Botões rápidos</text>
  <text x="905" y="800" text-anchor="middle" fill="#9878b0" font-size="8">Bloqueio imediato</text>
  <text x="905" y="811" text-anchor="middle" fill="#9878b0" font-size="8">de IP</text>

  <rect x="985" y="720" width="120" height="100" rx="7" fill="#1e0f28" stroke="#a06cd5" stroke-width="1"/>
  <text x="1045" y="750" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">🔔 Webhook</text>
  <text x="1045" y="768" text-anchor="middle" fill="#d4b8ec" font-size="9">notificador.py</text>
  <text x="1045" y="800" text-anchor="middle" fill="#9878b0" font-size="8">Alertas para</text>
  <text x="1045" y="811" text-anchor="middle" fill="#9878b0" font-size="8">Discord/SIEM</text>

  <path d="M1050 590 L1050 630 L900 630 L900 695" fill="none" stroke="#a06cd5" stroke-width="1.6" marker-end="url(#arrowPurple)"/>

  <!-- Remediação de volta para infraestrutura -->
  <path d="M680 745 C 400 900, 100 850, 190 270" fill="none" stroke="#a06cd5" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowPurple)" opacity="0.75"/>
  <path d="M680 770 C 300 950, 460 900, 460 270" fill="none" stroke="#a06cd5" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowPurple)" opacity="0.75"/>
  <text x="330" y="930" fill="#a06cd5" font-size="10" font-style="italic">↺ remediação SOAR (bloqueio de firewall / restart de serviços)</text>

  <!-- Footer -->
  <text x="700" y="975" text-anchor="middle" fill="#4a4a5a" font-size="11">VanguardSec AI v1.0 — David Nonato · github.com/DavidNonato23</text>
</svg>
