  <path d="M315 530 L325 530" stroke="#00ff9d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M475 530 L485 530" stroke="#00ff9d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

