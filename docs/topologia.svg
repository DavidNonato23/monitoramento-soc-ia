    <rect x="610" y="150" width="240" height="120" rx="10" fill="url(#infraGrad)" stroke="#e94560" stroke-width="1.8"/>
  </g>
  <text x="730" y="180" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">📡 Telemetria Local</text>
  <text x="730" y="203" text-anchor="middle" fill="#c8c8d8" font-size="11.5">Métricas via psutil (CPU/RAM)</text>
  <text x="730" y="221" text-anchor="middle" fill="#c8c8d8" font-size="11.5">Conexões de Rede (LISTEN)</text>
  <text x="730" y="239" text-anchor="middle" fill="#c8c8d8" font-size="11.5">Firewall do Sistema Operacional</text>

  <!-- ============ CAMADA 2: ENGINE CORE ============ -->
  <g filter="url(#glowCyan)">
